name: Disposable integration

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terraform-release-state-integration-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      STATE_TEST_TAG: terraform-state-integration-${{ github.run_id }}
      STATE_TEST_PATH: test-state/terraform.tfstate
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pnpm
        run: npm install --global pnpm@11.17.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run mocked API failure coverage
        run: pnpm test
      - run: mkdir -p test-state

      - name: Restore missing state with explicit bootstrap
        id: restore-empty
        uses: ./
        with:
          operation: restore
          github-token: ${{ github.token }}
          state-repository: ${{ github.repository }}
          release-tag: ${{ env.STATE_TEST_TAG }}
          state-path: ${{ env.STATE_TEST_PATH }}
          bootstrap: "true"

      - name: Create initial disposable state
        run: printf '%s\n' '{"version":4,"terraform_version":"test","serial":1,"lineage":"integration"}' > "$STATE_TEST_PATH"

      - name: Save bootstrapped state
        id: save-initial
        uses: ./
        with:
          operation: save
          github-token: ${{ github.token }}
          state-repository: ${{ github.repository }}
          release-tag: ${{ env.STATE_TEST_TAG }}
          state-path: ${{ env.STATE_TEST_PATH }}
          bootstrap: "true"
          expected-remote-state-marker: ${{ steps.restore-empty.outputs.remote-state-marker }}
          backup-retention: "1"

      - name: Require explicit bootstrap output
        if: steps.save-initial.outputs.bootstrapped != 'true'
        run: exit 1

      - name: Restore current state
        id: restore-current
        uses: ./
        with:
          operation: restore
          github-token: ${{ github.token }}
          state-repository: ${{ github.repository }}
          release-tag: ${{ env.STATE_TEST_TAG }}
          state-path: ${{ env.STATE_TEST_PATH }}

      - name: Simulate updated Terraform state
        run: printf '%s\n' '{"version":4,"terraform_version":"test","serial":2,"lineage":"integration"}' > "$STATE_TEST_PATH"

      - name: Mutate remote state to simulate a concurrent writer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$STATE_TEST_TAG" --jq '.assets[] | select(.name == "terraform.tfstate") | .id')
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          mkdir -p test-state/remote
          printf '%s\n' '{"version":4,"terraform_version":"test","serial":99,"lineage":"integration"}' > test-state/remote/terraform.tfstate
          gh release upload "$STATE_TEST_TAG" test-state/remote/terraform.tfstate --repo "$GITHUB_REPOSITORY"

      - name: Assert remote consistency conflict
        id: conflict
        continue-on-error: true
        uses: ./
        with:
          operation: save
          github-token: ${{ github.token }}
          state-repository: ${{ github.repository }}
          release-tag: ${{ env.STATE_TEST_TAG }}
          state-path: ${{ env.STATE_TEST_PATH }}
          expected-remote-state-marker: ${{ steps.restore-current.outputs.remote-state-marker }}

      - name: Require the consistency conflict
        if: steps.conflict.outcome != 'failure'
        run: exit 1

      - name: Restore state after conflict
        id: restore-after-conflict
        uses: ./
        with:
          operation: restore
          github-token: ${{ github.token }}
          state-repository: ${{ github.repository }}
          release-tag: ${{ env.STATE_TEST_TAG }}
          state-path: ${{ env.STATE_TEST_PATH }}

      - name: Prepare final disposable state
        run: printf '%s\n' '{"version":4,"terraform_version":"test","serial":2,"lineage":"integration"}' > "$STATE_TEST_PATH"

      - name: Save updated state and create backup
        uses: ./
        with:
          operation: save
          github-token: ${{ github.token }}
          state-repository: ${{ github.repository }}
          release-tag: ${{ env.STATE_TEST_TAG }}
          state-path: ${{ env.STATE_TEST_PATH }}
          expected-remote-state-marker: ${{ steps.restore-after-conflict.outputs.remote-state-marker }}
          backup-retention: "1"

      - name: Restore state for retention rollover
        id: restore-retention
        uses: ./
        with:
          operation: restore
          github-token: ${{ github.token }}
          state-repository: ${{ github.repository }}
          release-tag: ${{ env.STATE_TEST_TAG }}
          state-path: ${{ env.STATE_TEST_PATH }}

      - name: Prepare second updated disposable state
        run: printf '%s\n' '{"version":4,"terraform_version":"test","serial":3,"lineage":"integration"}' > "$STATE_TEST_PATH"

      - name: Save second state and enforce backup retention
        uses: ./
        with:
          operation: save
          github-token: ${{ github.token }}
          state-repository: ${{ github.repository }}
          release-tag: ${{ env.STATE_TEST_TAG }}
          state-path: ${{ env.STATE_TEST_PATH }}
          expected-remote-state-marker: ${{ steps.restore-retention.outputs.remote-state-marker }}
          backup-retention: "1"

      - name: Assert one current backup remains after retention
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          backup_count=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$STATE_TEST_TAG" --jq '[.assets[] | select(.name | startswith("terraform.tfstate.backup-")) | select(.name | endswith(".metadata.json") | not)] | length')
          test "$backup_count" -eq 1

      - name: Add unrelated asset to test reset fail-closed behavior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' integration-only > test-state/unrelated.txt
          gh release upload "$STATE_TEST_TAG" test-state/unrelated.txt --repo "$GITHUB_REPOSITORY"

      - name: Assert reset refuses an unexpected asset
        id: reset-guard
        continue-on-error: true
        uses: ./
        with:
          operation: reset
          confirmation: RESET
          github-token: ${{ github.token }}
          state-repository: ${{ github.repository }}
          release-tag: ${{ env.STATE_TEST_TAG }}
          state-asset: terraform.tfstate

      - name: Require reset guard failure
        if: steps.reset-guard.outcome != 'failure'
        run: exit 1

      - name: Remove integration-only unrelated asset
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$STATE_TEST_TAG" --jq '.assets[] | select(.name == "unrelated.txt") | .id' || true)
          if [ -n "$asset_id" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          fi

      - name: Reset disposable state
        if: success()
        uses: ./
        with:
          operation: reset
          confirmation: RESET
          github-token: ${{ github.token }}
          state-repository: ${{ github.repository }}
          release-tag: ${{ env.STATE_TEST_TAG }}
          state-asset: terraform.tfstate

      - name: Restore clean state storage after reset
        if: success()
        run: rm -f "$STATE_TEST_PATH"

      - name: Bootstrap clean state storage after reset
        if: success()
        uses: ./
        with:
          operation: restore
          bootstrap: "true"
          github-token: ${{ github.token }}
          state-repository: ${{ github.repository }}
          release-tag: ${{ env.STATE_TEST_TAG }}
          state-path: ${{ env.STATE_TEST_PATH }}

      - name: Generate disposable age key material
        if: success()
        run: |
          node --input-type=module -e 'import { appendFileSync } from "node:fs"; import { generateIdentity, identityToRecipient } from "age-encryption"; const identity = await generateIdentity(); const recipient = await identityToRecipient(identity); appendFileSync(process.env.GITHUB_ENV, `STATE_TEST_AGE_IDENTITY=${identity}\nSTATE_TEST_AGE_RECIPIENT=${recipient}\n`);'

      - name: Save encrypted disposable state
        if: success()
        run: printf '%s\n' '{"version":4,"terraform_version":"test","serial":4,"lineage":"encrypted-integration"}' > "$STATE_TEST_PATH"

      - name: Persist encrypted disposable state
        if: success()
        uses: ./
        with:
          operation: save
          github-token: ${{ github.token }}
          state-repository: ${{ github.repository }}
          release-tag: ${{ env.STATE_TEST_TAG }}
          state-path: ${{ env.STATE_TEST_PATH }}
          bootstrap: "true"
          expected-remote-state-marker: absent
          encryption: age
          age-recipients: ${{ env.STATE_TEST_AGE_RECIPIENT }}

      - name: Verify encrypted asset is not plaintext
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$STATE_TEST_TAG" --jq '.assets[] | select(.name == "terraform.tfstate") | .id')
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/state.age"
          ! grep -F 'encrypted-integration' "$RUNNER_TEMP/state.age"

      - name: Restore encrypted disposable state
        if: success()
        run: rm -f "$STATE_TEST_PATH"

      - name: Decrypt encrypted disposable state
        if: success()
        uses: ./
        with:
          operation: restore
          github-token: ${{ github.token }}
          state-repository: ${{ github.repository }}
          release-tag: ${{ env.STATE_TEST_TAG }}
          state-path: ${{ env.STATE_TEST_PATH }}
          encryption: age
          age-identities: ${{ env.STATE_TEST_AGE_IDENTITY }}

      - name: Verify decrypted disposable state
        if: success()
        run: grep -F 'encrypted-integration' "$STATE_TEST_PATH"

      - name: Cleanup disposable release with native reset
        if: always()
        uses: ./
        with:
          operation: reset
          confirmation: RESET
          github-token: ${{ github.token }}
          state-repository: ${{ github.repository }}
          release-tag: ${{ env.STATE_TEST_TAG }}
          state-asset: terraform.tfstate
