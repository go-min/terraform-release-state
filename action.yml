name: Terraform Release State
description: Store, restore, verify, encrypt, and back up Terraform state with GitHub Release assets.
author: go-min
inputs:
  operation:
    description: "State operation: restore, save, reset, or import."
    required: true
  github-token:
    description: Token with Contents read for restore/import; Contents write is required only for bootstrap, save, reset, or import PR changes.
    required: true
  state-repository:
    description: owner/name of the repository that stores the Release asset.
    required: false
    default: ""
  release-tag:
    description: GitHub Release tag used for state storage.
    required: false
    default: terraform-state
  state-asset:
    description: Current state asset filename.
    required: false
    default: terraform.tfstate
  state-path:
    description: Workspace-relative path for the local state file; required for restore and save.
    required: false
  bootstrap:
    description: Explicitly allow creation of missing state storage.
    required: false
    default: "false"
  expected-remote-state-marker:
    description: Marker returned by restore and passed to save for optimistic consistency.
    required: false
    default: ""
  backup-retention:
    description: Number of complete backup bundles to retain.
    required: false
    default: "20"
  source-commit:
    description: Commit SHA written to backup metadata and manifests.
    required: false
    default: ""
  workflow-run-id:
    description: Workflow run ID written to backup metadata and manifests.
    required: false
    default: ""
  confirmation:
    description: "Required exact confirmation RESET for the destructive reset operation."
    required: false
    default: ""
  imports-path:
    description: Workspace-relative path to the proposed Terraform imports file.
    required: false
    default: ./imports.generated.tf
  terraform-root:
    description: Workspace-relative Terraform configuration root scanned recursively for existing import targets.
    required: false
    default: .
  create-pr:
    description: Explicitly create or update a pull request for a changed imports file.
    required: false
    default: "false"
  pr-base:
    description: Base branch for the Terraform import proposal pull request; defaults to GITHUB_REF_NAME.
    required: false
    default: ""
  pr-branch:
    description: Branch for the Terraform import proposal pull request; defaults to terraform-release-state/<imports-filename>.
    required: false
    default: ""
  pr-title:
    description: Pull request title for the Terraform import proposal.
    required: false
    default: "chore(terraform): update generated imports"
  encryption:
    description: "State encryption mode: none or age."
    required: false
    default: none
  age-recipients:
    description: Newline-delimited age1 recipients required to save with encryption=age.
    required: false
    default: ""
  age-identities:
    description: Secret newline-delimited AGE-SECRET-KEY-1 identities required to restore with encryption=age.
    required: false
    default: ""
  signature-policy:
    description: "Manifest signature policy: allow-unsigned or require. Signed objects always require a matching verification key."
    required: false
    default: allow-unsigned
  signing-private-key:
    description: Unencrypted PKCS#8 PEM Ed25519 private key used only by save to sign new manifests.
    required: false
    default: ""
  verification-public-keys:
    description: Newline-delimited Ed25519 public keys in ed25519:<base64url-raw-32-byte-key> format; multiple keys support rotation.
    required: false
    default: ""
outputs:
  operation:
    description: Completed operation.
  bootstrapped:
    description: Whether this operation explicitly created missing state storage.
  release-id:
    description: GitHub Release ID.
  state-asset-id:
    description: Current state asset ID after the operation, when present.
  remote-state-marker:
    description: Opaque marker to pass from restore to save.
  state-digest:
    description: GitHub-reported SHA-256 digest of the stored Release asset when available; retained for compatibility.
  state-sha256:
    description: SHA-256 checksum of the plaintext state; retained for compatibility.
  stored-state-sha256:
    description: Locally computed SHA-256 checksum of the stored Release asset bytes (ciphertext when encryption is enabled).
  plaintext-state-sha256:
    description: Locally computed SHA-256 checksum of the plaintext Terraform state bytes.
  storage-format:
    description: Detected storage format; absent, legacy, or manifest-v1.
  manifest-schema-version:
    description: Validated manifest schema version when a manifest is present.
  signature-status:
    description: Manifest signature result; verified or unsigned.
  signature-key-fingerprint:
    description: Non-secret SHA-256 fingerprint of the Ed25519 key that verified the manifest.
  stored-state-verification:
    description: Stored-byte verification result; verified, not-recorded, or not-performed.
  plaintext-state-verification:
    description: Plaintext verification result; verified, authenticated, not-recorded, or not-performed.
  warning-count:
    description: Number of structured compatibility or signature warnings.
  warning-codes-json:
    description: JSON array of stable warning codes.
  error-code:
    description: Stable TRS_* failure code when the action fails.
  state-write-committed:
    description: Whether save verified and committed a new authoritative current state, including when later maintenance fails.
  state-phase:
    description: Last completed state lifecycle phase; complete on success or maintenance when post-commit cleanup fails.
  state-status:
    description: State lifecycle status; success or maintenance-failed.
  backup-asset-name:
    description: Backup asset created during save, when applicable.
  backup-count:
    description: Number of retained backup bundles after save.
  reset-deleted-asset-count:
    description: Number of state and backup assets deleted by reset.
  reset-release-found:
    description: Whether reset found the target state release.
  import-pr-url:
    description: Pull request URL created, updated, or closed for the Terraform import proposal, when enabled.
  import-candidate-count:
    description: Number of import blocks proposed after duplicate-target suppression.
  import-skipped-count:
    description: Number of state resources excluded from the proposal, including duplicate targets.
  import-collision-count:
    description: Number of candidates suppressed because their target already exists in Terraform configuration.
  import-pr-action:
    description: Import PR result; disabled, created, updated, unchanged, or closed.
runs:
  using: node24
  main: dist/index.js
branding:
  icon: database
  color: blue
