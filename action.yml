name: Terraform Release State
description: Store, restore, import, and reset same-repository Terraform state with a fixed GitHub Release protocol.
author: go-min
inputs:
  operation:
    description: "State operation: restore, save, import, or reset."
    required: true
  github-token:
    description: Token for the current repository; Contents read is sufficient for non-bootstrap restore, while save/reset and import PR management require their documented write permissions.
    required: true
  reset-target:
    description: Exact terraform.tfstate.backup-* asset to promote, or all to delete state storage; meaningful only for reset.
    required: false
    default: all
outputs:
  operation:
    description: Completed operation.
  bootstrapped:
    description: Whether restore created missing storage under TERRAFORM_BOOTSTRAP=true.
  release-id:
    description: GitHub Release ID.
  state-asset-id:
    description: Current state asset ID after the operation, when present.
  remote-state-marker:
    description: Opaque marker for the observed or newly authoritative current state.
  state-digest:
    description: GitHub-reported SHA-256 digest of the stored Release asset when available; retained for compatibility.
  state-sha256:
    description: SHA-256 checksum of plaintext state; retained with its original meaning.
  stored-state-sha256:
    description: Locally computed SHA-256 checksum of stored Release asset bytes.
  plaintext-state-sha256:
    description: Locally computed SHA-256 checksum of plaintext Terraform state bytes.
  storage-format:
    description: Detected storage format; absent, legacy, or manifest-v1.
  manifest-schema-version:
    description: Validated manifest schema version when a manifest is present.
  signature-status:
    description: Signature compatibility status; v0.5 emits unsigned.
  signature-key-fingerprint:
    description: Retained compatibility output; unset for v0.5 plaintext unsigned storage.
  stored-state-verification:
    description: Stored-byte verification result; verified, not-recorded, or not-performed.
  plaintext-state-verification:
    description: Plaintext verification result; verified, not-recorded, or not-performed.
  warning-count:
    description: Number of structured compatibility warnings.
  warning-codes-json:
    description: JSON array of stable warning codes.
  error-code:
    description: Stable TRS_* failure code when the action fails.
  state-write-committed:
    description: Whether a new current state was remotely verified and made authoritative.
  state-phase:
    description: Last completed lifecycle phase; complete on success or maintenance when post-commit work fails.
  state-status:
    description: Lifecycle status; success or maintenance-failed.
  backup-asset-name:
    description: Safety or save backup created by the operation, when applicable.
  backup-count:
    description: Number of retained backup bundles after save.
  reset-deleted-asset-count:
    description: Number of state assets deleted by reset-target all.
  reset-release-found:
    description: Whether reset found the fixed terraform-state Release.
  reset-action:
    description: Reset result; deleted, promoted, or unchanged.
  reset-target:
    description: Effective reset target.
  reset-promoted-marker:
    description: Marker of the authoritative current state after backup promotion.
  import-pr-url:
    description: URL of the fixed same-repository Terraform import proposal, when present.
  import-candidate-count:
    description: Number of import blocks proposed after duplicate-target suppression.
  import-skipped-count:
    description: Number of state resources excluded from the proposal, including duplicate targets.
  import-collision-count:
    description: Number of candidates suppressed because their target already exists under terraform.
  import-pr-action:
    description: Import PR result; created, updated, unchanged, or closed.
runs:
  using: node24
  main: dist/index.js
branding:
  icon: database
  color: blue
